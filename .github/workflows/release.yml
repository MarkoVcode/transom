name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.0.0). Creates a draft release."
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create the draft release once, so the per-platform jobs can all upload into
  # it. Doing this inside the matrix would race and produce duplicate releases.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.value }}';
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Transom ${version}`,
              body: [
                '## Downloads',
                '',
                '| Platform | File |',
                '| --- | --- |',
                '| Windows | `.msi` (installer) or `.exe` (NSIS setup) |',
                '| macOS (Apple silicon) | `_aarch64.dmg` |',
                '| macOS (Intel) | `_x64.dmg` |',
                '| Linux | `.AppImage` (portable) or `.deb` |',
                '',
                '### Updating',
                '',
                'Existing installations offer this release on launch and apply it in place — no reinstall needed. `.deb`/`.rpm` installs are the exception: those are owned by the package manager and open this page instead.',
                '',
                '### Note on unsigned builds',
                '',
                'These binaries are **not code-signed**. On first launch:',
                '',
                '- **macOS** — Gatekeeper will refuse to open it. Right-click the app and choose *Open*, or run `xattr -dr com.apple.quarantine "/Applications/Transom.app"`.',
                '- **Windows** — SmartScreen shows "Windows protected your PC". Click *More info* → *Run anyway*.',
                '',
                '### Requirements',
                '',
                'None. The app runs without administrator privileges and needs no additional tools installed — open **Setup & Status** in the app to see exactly which optional capabilities are available on your machine.',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return data.id;
          result-encoding: string

  build:
    name: ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - name: Linux (x86_64)
            # Built on the oldest supported runner: glibc is forward-compatible
            # but not backward, so building on a newer image would break older
            # distributions.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            patchelf

      - run: npm ci

      # Engine tests run per-platform here too: a release should never ship a
      # platform whose own parsing tests fail.
      - name: Test engine
        run: cargo test -p netdiag-core

      # Signing is opt-in. The env vars below are only set when the certificate
      # secret is actually populated: Tauri treats a *defined but empty*
      # APPLE_CERTIFICATE as "sign this", then fails importing an empty
      # certificate, so passing the secrets unconditionally breaks unsigned
      # builds on macOS.
      - name: Detect signing configuration
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "${APPLE_CERTIFICATE}" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

      # TAURI_SIGNING_* is the updater's minisign key, and is unrelated to code
      # signing: it is what the installed app checks before applying an update.
      # It is required on every platform — without it the bundler cannot produce
      # the updater artifacts that `createUpdaterArtifacts` asks for.
      - name: Build and upload (unsigned)
        if: steps.signing.outputs.macos == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          # Each job merges its own platforms into the release's existing
          # latest.json rather than replacing it, so the four builds accumulate.
          uploadUpdaterJson: true

      # To produce signed macOS builds, add these repository secrets and this
      # step takes over automatically:
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      # For Windows Authenticode, add TAURI_WINDOWS_CERTIFICATE_THUMBPRINT.
      - name: Build and upload (signed)
        if: steps.signing.outputs.macos == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: true

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest

    # Beyond `contents`, attestation needs an OIDC token to prove to Sigstore
    # which workflow is asking, and permission to record the result. Declaring
    # them per-job rather than workflow-wide keeps the build jobs — which run
    # third-party actions over the signing key — unable to mint either.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # Fetched once, then reused by every step below: the manifest check, the
      # checksums and the attestation all need the same bytes, and downloading
      # them three times invites the three to disagree.
      - name: Download the release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          mkdir -p dist
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | "\(.id)\t\(.name)"' > assets.tsv

          while IFS=$'\t' read -r id name; do
            # A re-run would otherwise checksum a previous run's checksum file.
            [ "$name" = "SHA256SUMS" ] && continue
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -H "Accept: application/octet-stream" > "dist/$name"
          done < assets.tsv

          ls -l dist

      # Every build job rewrites latest.json by reading the release's current
      # copy, merging its own platforms in and re-uploading. Two jobs finishing
      # at the same instant can therefore drop one platform's entry. Shipping
      # that would leave those users silently unable to update — and unable to
      # find out why — so the release stays a draft until the manifest is whole.
      # Re-running the workflow regenerates it.
      - name: Verify the updater manifest covers every platform
        run: |
          if [ ! -s dist/latest.json ]; then
            echo "::error::No latest.json was uploaded; installed apps would find no update."
            exit 1
          fi
          cp dist/latest.json latest.json

          echo "Platforms present:"
          jq -r '.platforms | keys[]' latest.json

          missing=0
          for key in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            if ! jq -e --arg k "$key" \
              '.platforms[$k].url and .platforms[$k].signature' latest.json > /dev/null; then
              echo "::error::latest.json has no usable entry for $key"
              missing=1
            fi
          done

          exit $missing

      # The updater's minisign signatures only protect *updates*. Nothing
      # covered the first download, which is the copy a new user runs before any
      # update logic exists to protect them. Checksums close the cheap half of
      # that: `sha256sum -c SHA256SUMS` after downloading.
      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          (cd dist && sha256sum -- *) > SHA256SUMS
          cat SHA256SUMS

          # A re-run must replace the old file rather than collide with it.
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name == "SHA256SUMS") | .id')
          if [ -n "$old" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          fi

          gh api --method POST \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SHA256SUMS" \
            -H "Content-Type: text/plain" \
            --input SHA256SUMS > /dev/null

      # Signed by Sigstore against this workflow's OIDC identity, so there is no
      # long-lived key to store, rotate or lose — unlike the updater key, whose
      # loss would strand every install. Binds each artifact's digest to the
      # commit and workflow that produced it:
      #
      #     gh attestation verify <file> --repo MarkoVcode/transom
      #
      # The .sig files and latest.json are deliberately absent: they are
      # signatures and metadata *about* these artifacts, and are covered by
      # SHA256SUMS.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.msi
            dist/*.exe
            dist/*.dmg
            dist/*.app.tar.gz

      - name: Undraft release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });

      # The website statically caches the latest-release info; this tells it to
      # refetch now instead of waiting out its revalidation window. Runs after
      # undrafting so the site never revalidates into a still-draft (invisible)
      # release. The release itself is already out by this point, so a failure
      # here only means the site shows the previous version until its cache
      # expires — worth a red run to notice, not worth blocking anything.
      - name: Revalidate website release cache
        env:
          RELEASE_REVALIDATE_TOKEN: ${{ secrets.RELEASE_REVALIDATE_TOKEN_WEBSITE }}
        run: |
          if [ -z "$RELEASE_REVALIDATE_TOKEN" ]; then
            echo "::error::RELEASE_REVALIDATE_TOKEN_WEBSITE secret is not set; website was not revalidated."
            exit 1
          fi
          curl -fsS --retry 3 --retry-all-errors --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $RELEASE_REVALIDATE_TOKEN" \
            https://gettransom.com/api/release/revalidate
